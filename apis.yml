aid: omnipresent
name: Omnipresent
description: >-
  Omnipresent was a London-headquartered global employment company, founded in 2019 by
  Matthew Wilson and Guenther Eisinger, that acted as an Employer of Record so companies
  could hire, onboard, pay and manage employees and contractors in countries where they
  had no legal entity. Its platform handled local employment contracts, payroll, benefits,
  expenses and tax and labour compliance across more than 160 countries, and it sold
  packaged integrations with HR and payroll systems alongside an account-scoped REST API
  for custom integration work. The company raised roughly $138M, including a $120M Series B
  in March 2022 led by Kinnevik and Tencent, and was acquired by its competitor Deel in
  October 2025, after which clients, employees and contractors were migrated onto the Deel
  platform. Omnipresent never published a public developer portal, API reference or
  machine-readable specification, and its web presence has since been decommissioned:
  omnipresent.com now publishes only NS and Google Workspace MX records with no A record,
  www.omnipresent.com is NXDOMAIN, and the original omnipresent.group domain SERVFAILs at
  the registry. The company's GitHub organization is still public but holds four forks and
  one archived internal tech-radar CSV, with no API contract of any kind. This profile is
  retained as a historical record; there is no API surface left to enrich.
